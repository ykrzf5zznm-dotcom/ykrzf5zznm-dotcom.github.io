<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>몽실숲 캐릭터 갤러리</title>
<style>
 body{margin:0;padding:8px;background:#FDF1F8;font-family:-apple-system,sans-serif;}
 h2{font-size:13px;margin:12px 0 4px;color:#5A4868;}
 .grid{display:flex;flex-wrap:wrap;gap:4px;}
 .tile{width:120px;}
 .tile svg{display:block;width:120px;height:150px;overflow:visible;background:radial-gradient(80%% 70%% at 50%% 18%%,#fff 0%%,#FDF1F8 60%%,#EEE8FF 100%%);border-radius:10px;}
 .tile span{display:block;text-align:center;font-size:9px;color:#8E7C9A;margin-top:1px;}
</style></head><body>
<div id="out"></div>
<script>
  var BODIES = [
    { id: "cream", name: "크림", fill: "#FFF4E6", shade: "#FFE6CB", line: "#E0C4A4" },
    { id: "peach", name: "복숭아", fill: "#FFDCCB", shade: "#FFC7B1", line: "#E5A488" },
    { id: "lav", name: "라벤더", fill: "#E8DEFF", shade: "#D6C6FB", line: "#B9A3E8" },
    { id: "sky", name: "하늘", fill: "#DCEFFF", shade: "#C2E2FF", line: "#9CC3E8" },
    { id: "matcha", name: "말차", fill: "#E4F2D6", shade: "#CFE7BC", line: "#A8C894" },
    { id: "lemon", name: "레몬", fill: "#FFF7CB", shade: "#FCEBA2", line: "#DDC97C" },
    { id: "choco", name: "초코", fill: "#DCBA9D", shade: "#C9A181", line: "#A57C5D" },
    { id: "navy", name: "네이비", fill: "#BCC7E8", shade: "#A5B2DA", line: "#7E8CB9" }

  var FACES = [

    { id: "sleepy", name: "졸림" }, { id: "shy", name: "수줍" },
    { id: "wink", name: "윙크" }, { id: "cool", name: "쿨" },
    { id: "pat", name: "토닥" }, { id: "teary", name: "울먹" }
  ];
  var OUTFITS = [
    { id: "hoodie", name: "후드티" }, { id: "cardigan", name: "가디건" },
    { id: "sailor", name: "세일러" }, { id: "pajama", name: "잠옷" },
    { id: "overall", name: "멜빵" }, { id: "coat", name: "코트" },
    { id: "dress", name: "원피스" }, { id: "cape", name: "망토" },
    { id: "knit", name: "크롭니트" }, { id: "bearjam", name: "곰돌이잠옷" },
    { id: "jacket", name: "야구점퍼" }, { id: "apron", name: "앞치마" },
    { id: "none", name: "없음" }
  ];
  var SHOES = [
    { id: "sneaker", name: "운동화" }, { id: "boots", name: "어그부츠" },
    { id: "oxford", name: "메리제인" }, { id: "slipper", name: "슬리퍼" },
    { id: "rain", name: "레인부츠" }, { id: "bunny", name: "토끼슬리퍼" },
    { id: "hightop", name: "하이탑" }, { id: "flats", name: "리본플랫" },
    { id: "socks", name: "양말" }, { id: "bare", name: "맨발" }
  ];
  var ACCS = [
    { id: "ribbon", name: "리본" }, { id: "star", name: "별핀" },
    { id: "sprout", name: "새싹" }, { id: "rabbit", name: "토끼귀" },
    { id: "cat", name: "고양이귀" }, { id: "bear", name: "곰돌이귀" },
    { id: "beret", name: "베레모" }, { id: "crown", name: "미니왕관" },
    { id: "flower", name: "꽃핀" }, { id: "glasses", name: "안경" },
    { id: "roundglasses", name: "둥근안경" }, { id: "sunglass", name: "선글라스" },
    { id: "heartsun", name: "하트선글라스" }, { id: "headphone", name: "헤드폰" },
    { id: "scarf", name: "목도리" }, { id: "cheeks", name: "볼스티커" },
    { id: "wings", name: "천사날개" }, { id: "none", name: "없음" }
  ];

  function findBy(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function bodyById(id) { return findBy(BODIES, id) || BODIES[0]; }

  /* ── 몽실이 몸 (2등신 인형 체형) ─────────────────── */
  function torsoSVG(b) {
    var leg = '<rect x="46.4" y="105.6" width="11.2" height="31.4" rx="5.6" fill="' + b.fill +
      '" stroke="' + b.line + '" stroke-width="1.9"/>';
    var arm = '<g transform="rotate(9 36 97.5)">' +
      '<rect x="30.4" y="85" width="11.2" height="28" rx="5.6" fill="' + b.fill +
      '" stroke="' + b.line + '" stroke-width="1.9"/></g>';
    return '<ellipse cx="60" cy="147" rx="28" ry="4.2" fill="rgba(120,90,140,.13)"/>' +
      leg + '<g transform="translate(120,0) scale(-1,1)">' + leg + '</g>' +
      arm + '<g transform="translate(120,0) scale(-1,1)">' + arm + '</g>' +
      '<path d="M54.8 73.5 H65.2 V84.8 Q60 89 54.8 84.8 Z" fill="' + b.shade +
      '" stroke="' + b.line + '" stroke-width="1.6"/>' +
      '<path d="M60 84.8 C50 84.8 43.6 87.2 42.1 92.2 C40.6 98.2 40.3 105.6 41.3 112.3 ' +
      'C42.5 118.7 49.8 121.9 60 121.9 C70.2 121.9 77.5 118.7 78.7 112.3 ' +
      'C79.7 105.6 79.4 98.2 77.9 92.2 C76.4 87.2 70 84.8 60 84.8 Z" fill="' + b.fill +
      '" stroke="' + b.line + '" stroke-width="2.1"/>' +
      '<ellipse cx="60" cy="104.6" rx="11.5" ry="9.8" fill="#FFFFFF" opacity=".2"/>';
  }

  function headSVG(b) {
    return '<path d="M60 16 C77 16 89.5 26.5 92.5 41 C95 51.5 95 61 91.5 68 ' +
      'C87.5 76.5 78 80.6 60 80.6 C42 80.6 32.5 76.5 28.5 68 ' +
      'C25 61 25 51.5 27.5 41 C30.5 26.5 43 16 60 16 Z" fill="' + b.fill +
      '" stroke="' + b.line + '" stroke-width="2.2"/>' +
      '<ellipse cx="50" cy="32.5" rx="14.5" ry="9" fill="#FFFFFF" opacity=".24" transform="rotate(-16 50 32.5)"/>';
  }

  /* ── 신발 ──────────────────────────────────────── */
  function pairSVG(one) {
    return '<g>' + one + '<g transform="translate(120,0) scale(-1,1)">' + one + "</g></g>";
  }

  function shoesSVG(id, b) {
    if (id === "bare") {
      return '<ellipse cx="52" cy="137.2" rx="6.6" ry="3.8" fill="' + b.shade +
        '" stroke="' + b.line + '" stroke-width="1.6"/>' +
        '<ellipse cx="68" cy="137.2" rx="6.6" ry="3.8" fill="' + b.shade +
        '" stroke="' + b.line + '" stroke-width="1.6"/>';
    }
    if (id === "boots") {
      return pairSVG('<rect x="41.4" y="140.6" width="17.4" height="5.6" rx="2.8" fill="#5C4334"/>' +
        '<path d="M44.2 121.8 H57.8 Q58.4 121.8 58.4 124.2 V141 H43.6 V124.2 Q43.6 121.8 44.2 121.8 Z" fill="#8B6A55" stroke="#6E513F" stroke-width="1.5"/>' +
        '<rect x="43.2" y="121.4" width="15.2" height="4.8" rx="2.4" fill="#A9846C" stroke="#6E513F" stroke-width="1.1"/>' +
        '<path d="M46.4 132 H56.6" stroke="#A9846C" stroke-width="1.5"/>' +
        '<path d="M46 136.6 H57" stroke="#6E513F" stroke-width="1.3" opacity=".55"/>');
    }
    if (id === "oxford") {
      return pairSVG('<rect x="41.8" y="141.2" width="16.8" height="4.4" rx="2.2" fill="#37313F"/>' +
        '<path d="M44 144.6 Q41.4 139 46.4 136.2 L53.8 133 Q58.2 133.6 58.2 138.4 V144.6 Z" fill="#4B4453" stroke="#37313F" stroke-width="1.3"/>' +
        '<path d="M45.4 139 Q49.8 137 53.8 137.6" stroke="#8A7C97" stroke-width="1.3" fill="none" stroke-linecap="round"/>');
    }
    if (id === "slipper") {
      return pairSVG('<rect x="42.2" y="137.4" width="16.2" height="8.6" rx="4.3" fill="#FFD2E2" stroke="#F0B3CB" stroke-width="1.4"/>' +
        '<path d="M45.4 138.2 Q51 131.6 56.6 138.2" stroke="#E79FBF" stroke-width="3" fill="none" stroke-linecap="round"/>');
    }
    if (id === "rain") {
      return pairSVG('<rect x="41.2" y="140.2" width="17.6" height="5.8" rx="2.9" fill="#E5BD52"/>' +
        '<path d="M44 120.8 H57.8 Q58.4 120.8 58.4 123.2 V140.6 H43.4 V123.2 Q43.4 120.8 44 120.8 Z" fill="#FFD977" stroke="#E5BD52" stroke-width="1.5"/>' +
        '<rect x="43" y="120.4" width="15.6" height="4.6" rx="2.3" fill="#FFF0B8" stroke="#E5BD52" stroke-width="1"/>' +
        '<path d="M43.4 136.6 H58.4" stroke="#E5BD52" stroke-width="2"/>');
    }
    if (id === "bunny") {
      return pairSVG('<ellipse cx="50.6" cy="141.8" rx="9" ry="5" fill="#FFF1F6" stroke="#EFC2D3" stroke-width="1.4"/>' +
        '<ellipse cx="45.2" cy="136.6" rx="3.4" ry="6.6" fill="#FFF1F6" stroke="#EFC2D3" stroke-width="1.3" transform="rotate(-18 45.2 136.6)"/>' +
        '<ellipse cx="52.4" cy="134.8" rx="3.4" ry="6.6" fill="#FFF1F6" stroke="#EFC2D3" stroke-width="1.3" transform="rotate(8 52.4 134.8)"/>' +
        '<ellipse cx="45.6" cy="136.8" rx="1.6" ry="3.9" fill="#FFC9DC" transform="rotate(-18 45.6 136.8)"/>' +
        '<ellipse cx="52.6" cy="135" rx="1.6" ry="3.9" fill="#FFC9DC" transform="rotate(8 52.6 135)"/>' +
        '<circle cx="57.2" cy="140.8" r="1.3" fill="#E8A9C0"/>');
    }
    if (id === "hightop") {
      return pairSVG('<rect x="41.6" y="139.8" width="17.2" height="5.8" rx="2.9" fill="#FFFFFF" stroke="#D2CBDD" stroke-width="1"/>' +
        '<path d="M43.8 127 H57.2 Q58.2 127 58.2 129 V139.8 H42.8 V129 Q42.8 127 43.8 127 Z" fill="#F6F0E4" stroke="#CFC3B4" stroke-width="1.5"/>' +
        '<path d="M42.8 135.8 Q50.4 138.2 58.2 135.8 V139.8 H42.8 Z" fill="#FFFFFF" stroke="#D2CBDD" stroke-width="1"/>' +
        '<path d="M46.6 129.8 H54.2 M46.6 132.4 H54.2" stroke="#CFC3B4" stroke-width="1.3"/>' +
        '<circle cx="55.2" cy="129.8" r="2.4" fill="#D9614F"/>');
    }
    if (id === "flats") {
      return pairSVG('<path d="M42.4 136.2 Q41.4 144.6 47.4 145.2 H55 Q58.8 144.8 58.6 140.4 V136.2 Z" fill="#F6CFE6" stroke="#DDA6C6" stroke-width="1.3"/>' +
        '<path d="M50.4 136 l-4.6 -2.8 v5.6 Z" fill="#F7A9CF"/>' +
        '<path d="M50.4 136 l4.6 -2.8 v5.6 Z" fill="#F7A9CF"/>' +
        '<circle cx="50.4" cy="136" r="1.7" fill="#EE8DBD"/>' +
        '<rect x="42.4" y="143.2" width="16.2" height="2.6" rx="1.3" fill="#F2B7D6"/>');
    }
    if (id === "socks") {
      return pairSVG('<rect x="47" y="121.6" width="10" height="18.4" rx="4.8" fill="#FFFFFF" stroke="#DCD3E4" stroke-width="1.4"/>' +
        '<path d="M47.4 126.6 H56.6" stroke="#FFC0D4" stroke-width="1.8"/>' +
        '<path d="M47.4 129.8 H56.6" stroke="#FFC0D4" stroke-width="1.8"/>' +
        '<ellipse cx="52" cy="139.6" rx="6.2" ry="3.4" fill="#FFFFFF" stroke="#DCD3E4" stroke-width="1.4"/>');
    }
    return pairSVG('<rect x="41.6" y="139.4" width="17" height="6.2" rx="3.1" fill="#F7B6CE" stroke="#E995B2" stroke-width="1"/>' +
      '<path d="M43.8 129.8 H57 Q58.2 129.8 58.2 131.8 V140 H42.8 V132 Q42.8 129.8 43.8 129.8 Z" fill="#FFFFFF" stroke="#C9B9D4" stroke-width="1.5"/>' +
      '<path d="M47 132.6 H53.8" stroke="#E4D6EC" stroke-width="1.5" stroke-linecap="round"/>' +
      '<path d="M47 135.4 H53.8" stroke="#E4D6EC" stroke-width="1.5" stroke-linecap="round"/>' +
      '<path d="M43 138.2 H58" stroke="#FFC9DA" stroke-width="1.8"/>');
  }

  /* ── 표정 ──────────────────────────────────────── */
  function eyesOpen() {
    return '<ellipse cx="44" cy="47" rx="5" ry="5.9" fill="' + INK + '"/>' +
      '<circle cx="42.4" cy="44.8" r="1.6" fill="#fff" opacity=".92"/>' +
      '<ellipse cx="76" cy="47" rx="5" ry="5.9" fill="' + INK + '"/>' +
      '<circle cx="74.4" cy="44.8" r="1.6" fill="#fff" opacity=".92"/>';
  }
  function blush(op) {
    var o = op || ".45";
    return '<ellipse cx="32" cy="58" rx="6.2" ry="3.6" fill="#FFB3C4" opacity="' + o + '"/>' +
      '<ellipse cx="88" cy="58" rx="6.2" ry="3.6" fill="#FFB3C4" opacity="' + o + '"/>';
  }
  function mouthSmile() {
    return '<path d="M54.6 60 Q60 66 65.4 60" stroke="' + INK + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  }
  function mouthOpen() {
    return '<path d="M55 60 Q60 67.5 65 60 Z" fill="' + INK + '"/>';
  }
  function browAngry() {
    return '<path d="M68.5 39 L78 41.6" stroke="' + INK + '" stroke-width="1.8" stroke-linecap="round"/>';
  }

  function faceSVG(id, b) {
    if (id === "sparkle") {
      return '<ellipse cx="44" cy="46" rx="6.2" ry="6.8" fill="' + INK + '"/>' +
        '<circle cx="42" cy="43.6" r="2.1" fill="#fff" opacity=".95"/>' +
        '<ellipse cx="76" cy="46" rx="6.2" ry="6.8" fill="' + INK + '"/>' +
        '<circle cx="74" cy="43.6" r="2.1" fill="#fff" opacity=".95"/>' +
        blush(.55) +
        '<path d="M30 24 L32 29 L37 30 L32 33.4 L33.2 38 L30 35 L26.8 38 L28 33.4 L23 30 L28 29 Z" fill="#FFD25E"/>' +
        '<path d="M93 30 L94.4 33.6 L98 35 L94.4 36.4 L93 40 L91.6 36.4 L88 35 L91.6 33.6 Z" fill="#FFD98C"/>' +
        mouthOpen();
    }
    if (id === "sleepy") {
      return '<path d="M39 47 Q44 51.6 49 47" stroke="' + INK + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
        '<path d="M71 47 Q76 51.6 81 47" stroke="' + INK + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
        blush(.4) +
        '<path d="M56 60 Q60 63 64 60" stroke="' + INK + '" stroke-width="2" fill="none" stroke-linecap="round"/>' +
        '<g fill="none" stroke="#9A87A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M90 20 H97 L90 27 H97"/><path d="M98 9 H104 L98 15 H104"/></g>';
    }
    if (id === "shy") {
      return '<path d="M39 48 Q44 43.6 49 48" stroke="' + INK + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
        '<path d="M71 48 Q76 43.6 81 48" stroke="' + INK + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
        blush(.78) +
        '<path d="M56 61.5 q2 1.8 4 0 q2 -1.8 4 0" stroke="' + INK + '" stroke-width="2" fill="none" stroke-linecap="round"/>';
    }
    if (id === "wink") {
      return eyesOpen() +
        '<path d="M71 47.5 Q76 43.2 81 47.5" stroke="' + INK + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
        blush(.55) + mouthSmile();
    }
    if (id === "cool") {
      return '<rect x="38.4" y="45" width="11.6" height="3.5" rx="1.75" fill="' + INK + '"/>' +
        '<rect x="70" y="45" width="11.6" height="3.5" rx="1.75" fill="' + INK + '"/>' +
        browAngry() +
        '<path d="M54 61 Q60 64.8 66 60.6" stroke="' + INK + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
    }
    if (id === "pat") {
      return '<path d="M39 49 Q44 43.6 49 49" stroke="' + INK + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
        '<path d="M71 49 Q76 43.6 81 49" stroke="' + INK + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
        blush(.6) + mouthOpen() +
        '<path d="M27 30 q-3.4 -4.4 0 -6.6 q3.4 2.2 0 6.6 Z" fill="#FFB3C9"/>' +
        '<path d="M94 24 q-3.4 -4.4 0 -6.6 q3.4 2.2 0 6.6 Z" fill="#FFC7D8"/>';
    }
    if (id === "teary") {
      return eyesOpen() +
        '<path d="M42.2 53 q-2.4 3.6 0.6 4.6 q2.4 -1 0.6 -4.6 Z" fill="#9FD8F5"/>' +
        '<path d="M74.2 53 q-2.4 3.6 0.6 4.6 q2.4 -1 0.6 -4.6 Z" fill="#9FD8F5"/>' +
        blush(.6) +
        '<path d="M55 62.5 q2.5 -2.2 5 0 q2.5 2.2 5 0" stroke="' + INK + '" stroke-width="2" fill="none" stroke-linecap="round"/>';
    }
    return eyesOpen() + blush(.5) + mouthSmile();
  }

  /* ── 옷 ────────────────────────────────────────── */
  function sleevePair(fill, line, cuff) {
    var one = '<g transform="rotate(9 36 97.5)">' +
      '<rect x="29.4" y="84" width="13.2" height="25" rx="6.6" fill="' + fill +
        '" stroke="' + line + '" stroke-width="1.7"/>' +
      '<rect x="29.7" y="101.6" width="12.6" height="6.6" rx="3.3" fill="' + cuff +
        '" stroke="' + line + '" stroke-width="1.1"/>' +
      '</g>';
    return '<g>' + one + '<g transform="translate(120,0) scale(-1,1)">' + one + "</g></g>";
  }

  function trunkSVG(fill, line, d) {
    var p = d || 'M60 78 C48.6 78 39.8 81 37.8 87.4 C36 93.6 35.6 103 36.8 112 ' +
      'C38.2 120.6 47.6 125 60 125 C72.4 125 81.8 120.6 83.2 112 ' +
      'C84.4 103 84 93.6 82.2 87.4 C80.2 81 71.4 78 60 78 Z';
    return '<path d="' + p + '" fill="' + fill + '" stroke="' + line + '" stroke-width="1.8"/>';
  }

  function outfitSVG(id, b) {
    if (id === "none") return "";
    if (id === "hoodie") {
      var c1 = "#A8D8C8", c2 = "#7FBBA8", c3 = "#5F9C88";
      return sleevePair(c1, c3, c2) + trunkSVG(c1, c3) +
        '<path d="M44.6 82.5 C49.6 75.4 70.4 75.4 75.4 82.5 C70 92.4 50 92.4 44.6 82.5 Z" fill="' + c2 + '" stroke="' + c3 + '" stroke-width="1.6"/>' +
        '<path d="M55.4 89 V97" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round"/>' +
        '<path d="M64.6 89 V97" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round"/>' +
        '<circle cx="55.4" cy="98.2" r="1.6" fill="#FFFFFF"/>' +
        '<circle cx="64.6" cy="98.2" r="1.6" fill="#FFFFFF"/>' +
        '<path d="M48.4 105 H71.6 Q73.6 117 60 117 Q46.4 117 48.4 105 Z" fill="' + c2 + '" stroke="' + c3 + '" stroke-width="1.2"/>' +
        '<path d="M37.4 118.6 Q60 124.8 82.6 118.6" stroke="' + c2 + '" stroke-width="3.6" fill="none"/>';
    }
    if (id === "cardigan") {
      var k1 = "#FFC7A8", k2 = "#F2AE8B", k3 = "#DF9674";
      return sleevePair(k1, k3, k2) + trunkSVG("#FFF9FC", "#E7D9EE") +
        '<path d="M60 81.4 C50 81 41.4 82.6 39.6 88.4 C37.8 94.6 37.6 103.4 38.8 111.6 ' +
          'C40 119.2 47.4 122.8 55 122.8 L60 81.4 Z" fill="' + k1 + '" stroke="' + k3 + '" stroke-width="1.6"/>' +
        '<path d="M60 81.4 C70 81 78.6 82.6 80.4 88.4 C82.2 94.6 82.4 103.4 81.2 111.6 ' +
          'C80 119.2 72.6 122.8 65 122.8 L60 81.4 Z" fill="' + k1 + '" stroke="' + k3 + '" stroke-width="1.6"/>' +
        '<path d="M41.6 90 L42.8 117" stroke="' + k2 + '" stroke-width="1.3" opacity=".85"/>' +
        '<path d="M78.4 90 L77.2 117" stroke="' + k2 + '" stroke-width="1.3" opacity=".85"/>' +
        '<circle cx="57.4" cy="94" r="1.9" fill="' + k2 + '"/>' +
        '<circle cx="58.4" cy="104" r="1.9" fill="' + k2 + '"/>' +
        '<circle cx="59.4" cy="114" r="1.9" fill="' + k2 + '"/>' +
        '<path d="M37.6 119.6 Q60 125 82.4 119.6" stroke="' + k2 + '" stroke-width="2.6" fill="none"/>';
    }

        '<path d="M56.6 78.4 Q60 80.4 63.4 78.4" stroke="#FBD9DF" stroke-width="1.6" fill="none"/>';
    }
    if (id === "cheeks") {
      return '<path d="M30 56.4 l1.1 2.4 2.6 .4 -1.9 1.8 .5 2.6 -2.3 -1.3 -2.3 1.3 ' +

        'C88.1 56.6 89 55.8 90.1 56.7 C91.6 57.8 91 60 88 62 Z" fill="#FF7FA8" opacity=".92"/>';
    }
    if (id === "wings") {
      return "";

    return "";
  }

  function avatarSVG(a, opts) {
    opts = opts || {};
    var b = bodyById(a.body);
    var faceId = findBy(FACES, a.face) ? a.face : "smile";
    var outfitId = findBy(OUTFITS, a.outfit) ? a.outfit : "hoodie";
    var shoeId = findBy(SHOES, a.shoes) ? a.shoes : "sneaker";
    var accId = findBy(ACCS, a.acc) ? a.acc : "none";
    var vb = opts.box || "0 0 120 150";
    var s = '<svg class="av-svg" viewBox="' + vb + '" xmlns="http://www.w3.org/2000/svg"' +
      ' aria-hidden="true" focusable="false">';
    if (accId === "wings") s += wingsSVG();
    s += torsoSVG(b);
    s += shoesSVG(shoeId, b);
    s += outfitSVG(outfitId, b);
    s += headSVG(b);
    s += faceSVG(faceId, b);
    s += accSVG(accId, b);
    if (!opts.noDraw && a.drawingData) {
      s += '<image href="' + a.drawingData + '" x="0" y="0" width="120" height="150"' +
        ' preserveAspectRatio="none"/>';
    }
    return s + "</svg>";
  }

}
